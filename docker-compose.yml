services:

  delivery-db:
    image: postgres:17
    environment:
      POSTGRES_DB: delivery_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - delivery-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delivery_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped


  courier-db:
    image: postgres:17
    environment:
      POSTGRES_DB: courier_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - courier-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d courier_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped


  notification-db:
    image: postgres:17
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped


  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"

      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list > /dev/null 2>&1"
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

    restart: unless-stopped


  delivery-service:
    build:
      context: ./delivery-service

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://delivery-db:5432/delivery_db
      DB_USERNAME: postgres
      DB_PASSWORD: "${POSTGRES_PASSWORD}"

      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

      SERVER_PORT: 8080

    depends_on:
      delivery-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

    restart: on-failure


  courier-service:
    build:
      context: ./courier-service

    ports:
      - "8081:8081"

    environment:
      DB_URL: jdbc:postgresql://courier-db:5432/courier_db
      DB_USERNAME: postgres
      DB_PASSWORD: "${POSTGRES_PASSWORD}"

      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

      SERVER_PORT: 8081

    depends_on:
      courier-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

    restart: on-failure


  notification-service:
    build:
      context: ./notification-service

    ports:
      - "8082:8082"

    environment:
      DB_URL: jdbc:postgresql://notification-db:5432/notification_db
      DB_USERNAME: postgres
      DB_PASSWORD: "${POSTGRES_PASSWORD}"

      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

      SERVER_PORT: 8082

    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

    restart: on-failure


volumes:
  delivery-db-data:
  courier-db-data:
  notification-db-data: