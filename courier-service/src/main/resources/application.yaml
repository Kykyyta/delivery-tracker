spring:
  application:
    name: courier-service

  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/courier_db}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD}"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        "[spring.json.add.type.headers]": false

    consumer:
      group-id: courier-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        "[spring.json.use.type.headers]": false
        "[spring.json.value.default.type]": com.example.courierservice.event.DeliveryEvent
        "[spring.json.trusted.packages]": com.example.courierservice.event

server:
  port: "${SERVER_PORT:8081}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true

info:
  app:
    name: Courier Service
    description: Microservice for courier management
    version: 1.0.0

jwt:
  secret: "${JWT_SECRET}"