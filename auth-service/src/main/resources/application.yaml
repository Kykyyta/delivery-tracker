spring:
  application:
    name: auth-service

  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/delivery_auth}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD}"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: "${SERVER_PORT:8083}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

jwt:
  secret: "${JWT_SECRET}"
  expiration-seconds: 3600